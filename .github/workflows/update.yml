name: Update dashboard

on:
  schedule:
    # Times are UTC. Weekdays only.
    - cron: "30 10 * * 1-5"   # ~6:30 am ET: overnight markets and news
    - cron: "45 13 * * 1-5"   # ~9:45 am ET (8:45 in winter): after 8:30 am data releases
    - cron: "15 22 * * 1-5"   # ~6:15 pm ET: market closes and Thursday's Fed balance sheet
  workflow_dispatch: {}        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write   # save the updated data files
  pages: write      # publish the website
  id-token: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests feedparser

      - name: Pull data from FRED and news feeds
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/build_data.py

      - name: Save updated data
        run: |
          git config user.name "econ-desk-bot"
          git config user.email "econ-desk-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

      - name: Package the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish the website
        id: deploy
        uses: actions/deploy-pages@v4
